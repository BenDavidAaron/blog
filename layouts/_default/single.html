{{ define "main" }}
  <article class="article">
    <p class="post-date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
    <div class="article-content">{{ .Content }}</div>
  </article>
{{ end }}
