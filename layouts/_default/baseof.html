<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="site-title" href="{{ site.Home.RelPermalink }}"><img src="{{ "logo.svg" | relURL }}" alt="">{{ site.Title }}</a>
        <nav aria-label="Main navigation">
          <a href="{{ "posts/" | relURL }}">Posts</a>
        </nav>
      </div>
    </header>
    <main class="container">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
